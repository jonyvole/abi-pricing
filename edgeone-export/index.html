<html lang="en">

  <meta name="viewport" content="width=device-width,initial-scale=1" />

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
  <script>
    (function () {
      function formatRelativeTime(iso) {
        const date = new Date(iso);
        if (Number.isNaN(date.getTime())) return "unknown";
        const seconds = Math.max(0, Math.floor((Date.now() - date.getTime()) / 1000));
        if (seconds < 60) return "just now";
        const minutes = Math.floor(seconds / 60);
        if (minutes < 60) return minutes + " minute" + (minutes === 1 ? "" : "s") + " ago";
        const hours = Math.floor(minutes / 60);
        if (hours < 24) return hours + " hour" + (hours === 1 ? "" : "s") + " ago";
        const days = Math.floor(hours / 24);
        return days + " day" + (days === 1 ? "" : "s") + " ago";
      }

      function mountFooter(lastEditedAt) {
        const el = document.createElement("div");
        el.id = "last-edited-indicator";
        el.style.position = "fixed";
        el.style.left = "12px";
        el.style.bottom = "10px";
        el.style.zIndex = "9999";
        el.style.fontSize = "12px";
        el.style.color = "#A0A0A0";
        el.style.background = "rgba(8, 9, 10, 0.7)";
        el.style.padding = "4px 8px";
        el.style.borderRadius = "6px";
        el.style.backdropFilter = "blur(2px)";

        function render() {
          el.textContent = "Last edited: " + (lastEditedAt ? formatRelativeTime(lastEditedAt) : "not available");
        }

        render();
        setInterval(render, 60000);
        document.body.appendChild(el);
      }

      fetch("/api/last-edited")
        .then(function (res) { return res.json(); })
        .then(function (data) {
          mountFooter(data && data.last_edited_at ? data.last_edited_at : null);
        })
        .catch(function () {
          mountFooter(null);
        });
    })();
  </script>
  <script>
    (function () {
      const isAdminPage = window.location.pathname === "/admin";

      function cardBase(el) {
        el.style.background = "rgba(8, 9, 10, 0.88)";
        el.style.border = "1px solid rgba(255, 255, 255, 0.12)";
        el.style.borderRadius = "10px";
        el.style.boxShadow = "0 6px 18px rgba(0,0,0,0.3)";
        el.style.color = "#EDEDED";
        el.style.fontFamily = "Arial, sans-serif";
      }

      function inputBase(el) {
        el.style.width = "100%";
        el.style.padding = "8px";
        el.style.borderRadius = "6px";
        el.style.border = "1px solid #3A3A3A";
        el.style.background = "#0F1115";
        el.style.color = "#F2F2F2";
      }

      if (!isAdminPage) {
        const btn = document.createElement("button");
        btn.textContent = "Suggestions";
        btn.style.position = "fixed";
        btn.style.right = "12px";
        btn.style.bottom = "10px";
        btn.style.zIndex = "10000";
        btn.style.background = "#3DA9FC";
        btn.style.border = "none";
        btn.style.color = "#06131F";
        btn.style.fontWeight = "700";
        btn.style.borderRadius = "8px";
        btn.style.padding = "8px 12px";
        btn.style.cursor = "pointer";

        const panel = document.createElement("div");
        panel.style.position = "fixed";
        panel.style.right = "12px";
        panel.style.bottom = "52px";
        panel.style.width = "min(360px, calc(100vw - 24px))";
        panel.style.padding = "12px";
        panel.style.display = "none";
        panel.style.zIndex = "10000";
        cardBase(panel);

        const title = document.createElement("div");
        title.textContent = "Send a suggestion";
        title.style.fontWeight = "700";
        title.style.marginBottom = "8px";

        const ownerContact = document.createElement("div");
        ownerContact.textContent = "Owner contact: Discord johny_vole";
        ownerContact.style.fontSize = "12px";
        ownerContact.style.color = "#A0A0A0";
        ownerContact.style.marginBottom = "8px";

        const name = document.createElement("input");
        name.placeholder = "Name (optional)";
        name.maxLength = 120;
        inputBase(name);

        const contact = document.createElement("input");
        contact.placeholder = "Contact (optional, e.g. Discord or email)";
        contact.maxLength = 200;
        contact.style.marginTop = "6px";
        inputBase(contact);

        const text = document.createElement("textarea");
        text.placeholder = "Write your idea here...";
        text.maxLength = 1000;
        text.style.width = "100%";
        text.style.height = "90px";
        text.style.borderRadius = "6px";
        text.style.padding = "8px";
        text.style.resize = "vertical";
        text.style.border = "1px solid #3A3A3A";
        text.style.background = "#0F1115";
        text.style.color = "#F2F2F2";
        text.style.marginTop = "6px";

        const row = document.createElement("div");
        row.style.display = "flex";
        row.style.justifyContent = "space-between";
        row.style.alignItems = "center";
        row.style.marginTop = "8px";

        const status = document.createElement("span");
        status.style.fontSize = "12px";
        status.style.color = "#A0A0A0";

        const submit = document.createElement("button");
        submit.textContent = "Submit";
        submit.style.background = "#4CAF50";
        submit.style.border = "none";
        submit.style.padding = "6px 10px";
        submit.style.borderRadius = "6px";
        submit.style.cursor = "pointer";
        submit.style.fontWeight = "700";

        submit.addEventListener("click", function () {
          const value = text.value.trim();
          if (!value) {
            status.textContent = "Please write a suggestion first.";
            return;
          }
          submit.disabled = true;
          status.textContent = "Sending...";
          fetch("/api/suggestions", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text: value, name: name.value.trim(), contact: contact.value.trim() }),
          })
            .then(function (res) {
              return res.json().catch(function () { return {}; }).then(function (data) {
                if (!res.ok) {
                  if (res.status === 429 && data && data.retry_after_seconds) {
                    throw new Error("Please wait " + data.retry_after_seconds + "s before sending another suggestion.");
                  }
                  throw new Error((data && data.detail) || "Request failed");
                }
                return data;
              });
            })
            .then(function () {
              text.value = "";
              status.textContent = "Thanks! Suggestion sent.";
            })
            .catch(function (err) {
              status.textContent = err && err.message ? err.message : "Could not send suggestion.";
            })
            .finally(function () {
              submit.disabled = false;
            });
        });

        btn.addEventListener("click", function () {
          panel.style.display = panel.style.display === "none" ? "block" : "none";
        });

        row.appendChild(status);
        row.appendChild(submit);
        panel.appendChild(title);
        panel.appendChild(ownerContact);
        panel.appendChild(name);
        panel.appendChild(contact);
        panel.appendChild(text);
        panel.appendChild(row);
        document.body.appendChild(btn);
        document.body.appendChild(panel);
        return;
      }

      const panel = document.createElement("div");
      panel.style.position = "fixed";
      panel.style.right = "12px";
      panel.style.top = "12px";
      panel.style.width = "min(520px, calc(100vw - 24px))";
      panel.style.maxHeight = "75vh";
      panel.style.overflow = "auto";
      panel.style.padding = "12px";
      panel.style.zIndex = "10000";
      cardBase(panel);

      const header = document.createElement("div");
      header.style.display = "flex";
      header.style.justifyContent = "space-between";
      header.style.alignItems = "center";
      header.style.marginBottom = "8px";

      const title = document.createElement("div");
      title.textContent = "Suggestions";
      title.style.fontWeight = "700";

      const collapseBtn = document.createElement("button");
      collapseBtn.textContent = "Collapse";
      collapseBtn.style.background = "rgba(255,255,255,0.1)";
      collapseBtn.style.border = "1px solid rgba(255,255,255,0.2)";
      collapseBtn.style.color = "#EDEDED";
      collapseBtn.style.padding = "4px 8px";
      collapseBtn.style.borderRadius = "6px";
      collapseBtn.style.cursor = "pointer";
      collapseBtn.style.fontSize = "12px";

      const tokenInput = document.createElement("input");
      tokenInput.type = "password";
      tokenInput.placeholder = "Admin password/token";
      inputBase(tokenInput);

      const controls = document.createElement("div");
      controls.style.display = "flex";
      controls.style.gap = "8px";
      controls.style.marginTop = "8px";
      controls.style.alignItems = "center";

      const loadBtn = document.createElement("button");
      loadBtn.textContent = "Load suggestions";
      loadBtn.style.background = "#3DA9FC";
      loadBtn.style.border = "none";
      loadBtn.style.padding = "6px 10px";
      loadBtn.style.borderRadius = "6px";
      loadBtn.style.cursor = "pointer";
      loadBtn.style.fontWeight = "700";

      const unreadOnlyLabel = document.createElement("label");
      unreadOnlyLabel.style.fontSize = "12px";
      unreadOnlyLabel.style.display = "flex";
      unreadOnlyLabel.style.alignItems = "center";
      unreadOnlyLabel.style.gap = "6px";
      const unreadOnly = document.createElement("input");
      unreadOnly.type = "checkbox";
      unreadOnlyLabel.appendChild(unreadOnly);
      unreadOnlyLabel.appendChild(document.createTextNode("Unread only"));

      const status = document.createElement("div");
      status.style.fontSize = "12px";
      status.style.marginTop = "8px";
      status.style.color = "#A0A0A0";

      const list = document.createElement("div");
      list.style.marginTop = "10px";
      list.style.display = "grid";
      list.style.gap = "8px";

      let cachedItems = [];
      const COLLAPSE_STATE_KEY = "abi_admin_suggestions_collapsed";
      let collapsed = false;

      function applyCollapsedState() {
        const display = collapsed ? "none" : "";
        tokenInput.style.display = display;
        controls.style.display = display;
        status.style.display = display;
        list.style.display = collapsed ? "none" : "grid";
        panel.style.width = collapsed ? "220px" : "min(520px, calc(100vw - 24px))";
        panel.style.maxHeight = collapsed ? "unset" : "75vh";
        panel.style.overflow = collapsed ? "hidden" : "auto";
        collapseBtn.textContent = collapsed ? "Expand" : "Collapse";
      }

      function currentToken() {
        return tokenInput.value.trim();
      }

      function updateItem(id, patchBody) {
        return fetch("/api/suggestions/" + encodeURIComponent(id), {
          method: "PATCH",
          headers: {
            "Content-Type": "application/json",
            "X-Admin-Token": currentToken(),
          },
          body: JSON.stringify(patchBody),
        }).then(function (res) {
          if (!res.ok) throw new Error("Update failed");
          return res.json();
        });
      }

      function deleteItem(id) {
        return fetch("/api/suggestions/" + encodeURIComponent(id), {
          method: "DELETE",
          headers: { "X-Admin-Token": currentToken() },
        }).then(function (res) {
          if (!res.ok) throw new Error("Delete failed");
          return res.json();
        });
      }

      function renderSuggestions() {
        const items = unreadOnly.checked ? cachedItems.filter(function (i) { return i.status !== "read"; }) : cachedItems.slice();
        list.innerHTML = "";
        if (!items.length) {
          const empty = document.createElement("div");
          empty.textContent = "No suggestions found.";
          empty.style.color = "#A0A0A0";
          list.appendChild(empty);
          return;
        }

        items.forEach(function (item) {
          const card = document.createElement("div");
          card.style.border = "1px solid rgba(255,255,255,0.1)";
          card.style.borderRadius = "8px";
          card.style.padding = "8px";
          card.style.background = item.status === "read" ? "rgba(255,255,255,0.02)" : "rgba(61,169,252,0.08)";

          const meta = document.createElement("div");
          meta.style.fontSize = "11px";
          meta.style.color = "#A0A0A0";
          meta.style.marginBottom = "6px";
          const who = item.name ? item.name : "Anonymous";
          const contactText = item.contact ? " | " + item.contact : "";
          const when = item.created_at ? new Date(item.created_at).toLocaleString() : "";
          const readTag = item.status === "read" ? " | read" : " | new";
          meta.textContent = who + contactText + " | " + when + readTag;

          const text = document.createElement("div");
          text.textContent = item.text || "";
          text.style.whiteSpace = "pre-wrap";
          text.style.wordBreak = "break-word";

          const actions = document.createElement("div");
          actions.style.display = "flex";
          actions.style.gap = "8px";
          actions.style.marginTop = "8px";

          const readBtn = document.createElement("button");
          readBtn.textContent = item.status === "read" ? "Mark unread" : "Mark read";
          readBtn.style.padding = "4px 8px";
          readBtn.style.border = "none";
          readBtn.style.borderRadius = "6px";
          readBtn.style.cursor = "pointer";
          readBtn.style.background = "#4CAF50";
          readBtn.style.fontWeight = "700";

          const delBtn = document.createElement("button");
          delBtn.textContent = "Delete";
          delBtn.style.padding = "4px 8px";
          delBtn.style.border = "none";
          delBtn.style.borderRadius = "6px";
          delBtn.style.cursor = "pointer";
          delBtn.style.background = "#FF3B30";
          delBtn.style.color = "#fff";
          delBtn.style.fontWeight = "700";

          readBtn.addEventListener("click", function () {
            if (!currentToken()) {
              status.textContent = "Enter admin token first.";
              return;
            }
            updateItem(item.id, { read: item.status !== "read" })
              .then(function (res) {
                const idx = cachedItems.findIndex(function (it) { return it.id === item.id; });
                if (idx >= 0) cachedItems[idx] = res.item || cachedItems[idx];
                renderSuggestions();
                status.textContent = "Suggestion updated.";
              })
              .catch(function () {
                status.textContent = "Could not update suggestion.";
              });
          });

          delBtn.addEventListener("click", function () {
            if (!currentToken()) {
              status.textContent = "Enter admin token first.";
              return;
            }
            if (!window.confirm("Delete this suggestion?")) return;
            deleteItem(item.id)
              .then(function () {
                cachedItems = cachedItems.filter(function (it) { return it.id !== item.id; });
                renderSuggestions();
                status.textContent = "Suggestion deleted.";
              })
              .catch(function () {
                status.textContent = "Could not delete suggestion.";
              });
          });

          actions.appendChild(readBtn);
          actions.appendChild(delBtn);
          card.appendChild(meta);
          card.appendChild(text);
          card.appendChild(actions);
          list.appendChild(card);
        });
      }

      function loadSuggestions() {
        const token = currentToken();
        if (!token) {
          status.textContent = "Enter admin password/token first.";
          return;
        }
        status.textContent = "Loading...";
        fetch("/api/suggestions", {
          headers: { "X-Admin-Token": token },
        })
          .then(function (res) {
            if (res.status === 401) throw new Error("Unauthorized");
            if (!res.ok) throw new Error("Request failed");
            return res.json();
          })
          .then(function (data) {
            cachedItems = Array.isArray(data) ? data : [];
            renderSuggestions();
            status.textContent = "Loaded.";
          })
          .catch(function (err) {
            status.textContent = err && err.message === "Unauthorized" ? "Invalid admin token." : "Could not load suggestions.";
          });
      }

      loadBtn.addEventListener("click", loadSuggestions);
      unreadOnly.addEventListener("change", renderSuggestions);

      collapseBtn.addEventListener("click", function () {
        collapsed = !collapsed;
        try {
          window.localStorage.setItem(COLLAPSE_STATE_KEY, collapsed ? "1" : "0");
        } catch (e) {}
        applyCollapsedState();
      });

      header.appendChild(title);
      header.appendChild(collapseBtn);
      panel.appendChild(header);
      controls.appendChild(loadBtn);
      controls.appendChild(unreadOnlyLabel);
      panel.appendChild(tokenInput);
      panel.appendChild(controls);
      panel.appendChild(status);
      panel.appendChild(list);
      document.body.appendChild(panel);

      try {
        collapsed = window.localStorage.getItem(COLLAPSE_STATE_KEY) === "1";
      } catch (e) {
        collapsed = false;
      }
      applyCollapsedState();
    })();
  </script>
  <script>
    (function () {
      if (window.location.pathname !== "/admin") return;

      var manualValues = { add: "", edit: "", last: "" };

      function normalizeManualValue(raw) {
        var value = String(raw || "").trim().replace(/\s+/g, " ");
        if (!value) return "";
        var dmy = value.match(/^(\d{2})\/(\d{2})\/(\d{4})(.*)$/);
        if (dmy) {
          value = dmy[3] + "-" + dmy[2] + "-" + dmy[1] + dmy[4];
        }
        return value.trim();
      }

      function toIsoDate(value) {
        if (!value) return "";
        var m = value.match(/^(\d{4})-(\d{2})-(\d{2})/);
        if (m) return m[1] + "-" + m[2] + "-" + m[3];
        return "";
      }

      function extractManualParts(value) {
        var m = String(value || "").match(/^(\d{4}-\d{2}-\d{2})\s+(.+)\s+(UTC[+-]\d{2}:\d{2})$/i);
        if (!m) return null;
        return { date: m[1], time: m[2].trim(), timezone: m[3].toUpperCase() };
      }

      function classifyInput(input) {
        var row = input && input.closest ? input.closest("tr") : null;
        return row ? "edit" : "add";
      }

      function ensureManualTextInput(input) {
        if (!input || input.dataset.snapshotDateMirrorReady === "1") return;
        input.dataset.snapshotDateMirrorReady = "1";

        var mode = classifyInput(input);
        var wrapper = document.createElement("div");
        wrapper.style.display = "flex";
        wrapper.style.flexDirection = "column";
        wrapper.style.gap = "4px";
        wrapper.style.width = "100%";
        wrapper.style.minWidth = "170px";

        var textInput = document.createElement("input");
        textInput.type = "text";
        textInput.placeholder = "YYYY-MM-DD 6pm UTC+02:00";
        textInput.autocomplete = "off";
        textInput.style.width = "100%";
        textInput.style.padding = "8px";
        textInput.style.borderRadius = "0";
        textInput.style.border = "1px solid #ffd000";
        textInput.style.background = "#0F1115";
        textInput.style.color = "#F2F2F2";
        textInput.style.fontFamily = "inherit";
        textInput.style.fontSize = "inherit";
        textInput.style.boxSizing = "border-box";
        textInput.title = "Type full snapshot label: YYYY-MM-DD 6pm UTC+02:00";

        var hint = document.createElement("div");
        hint.textContent = "Custom snapshot date/time/timezone";
        hint.style.fontSize = "11px";
        hint.style.color = "#A0A0A0";
        hint.style.lineHeight = "1.2";

        var dateCell = input.parentElement;
        if (!dateCell) return;
        dateCell.insertBefore(wrapper, input);
        wrapper.appendChild(textInput);
        wrapper.appendChild(hint);

        input.style.display = "none";
        input.tabIndex = -1;
        input.setAttribute("aria-hidden", "true");

        textInput.addEventListener("input", function () {
          var manual = normalizeManualValue(textInput.value);
          if (manual !== textInput.value.trim()) textInput.value = manual;
          manualValues[mode] = manual;
          manualValues.last = manual;
          var iso = toIsoDate(manual);
          if (iso) {
            input.value = iso;
            input.dispatchEvent(new Event("input", { bubbles: true }));
            input.dispatchEvent(new Event("change", { bubbles: true }));
          }
        });
      }

      function scanAndEnhanceDateInputs() {
        var inputs = document.querySelectorAll("input[type='date']");
        for (var i = 0; i < inputs.length; i += 1) {
          ensureManualTextInput(inputs[i]);
        }
      }

      function shouldPatchRequest(url, method) {
        if (method !== "POST") return false;
        return (
          url.indexOf("/api/price-points") >= 0 ||
          url.indexOf("/api/price-points/bulk") >= 0 ||
          url.indexOf("/api/price-points/edit-snapshot") >= 0
        );
      }

      function patchBody(url, bodyText) {
        var body;
        try {
          body = JSON.parse(bodyText);
        } catch (e) {
          return bodyText;
        }
        if (!body || typeof body !== "object") return bodyText;

        var manual = "";
        if (url.indexOf("/api/price-points/edit-snapshot") >= 0) {
          manual = manualValues.edit || manualValues.last || "";
        } else {
          manual = manualValues.add || manualValues.last || "";
        }
        manual = normalizeManualValue(manual);
        if (!manual) return bodyText;
        var parts = extractManualParts(manual);

        if (url.indexOf("/api/price-points/edit-snapshot") >= 0) {
          if (parts) {
            body.new_date = parts.date;
            body.new_time = parts.time;
            body.new_timezone = parts.timezone;
          } else {
            body.new_date = manual;
            delete body.new_time;
            delete body.new_timezone;
          }
        } else {
          if (parts) {
            body.date = parts.date;
            body.time = parts.time;
            body.timezone = parts.timezone;
          } else {
            body.date = manual;
            delete body.time;
            delete body.timezone;
          }
        }
        return JSON.stringify(body);
      }

      var originalFetch = window.fetch.bind(window);
      window.fetch = function (input, init) {
        var reqUrl = "";
        if (typeof input === "string") reqUrl = input;
        else if (input && input.url) reqUrl = input.url;

        var method = "GET";
        if (init && init.method) method = String(init.method).toUpperCase();
        else if (input && input.method) method = String(input.method).toUpperCase();

        if (!shouldPatchRequest(reqUrl, method)) return originalFetch(input, init);
        if (init && typeof init.body === "string") {
          var nextInit = Object.assign({}, init, { body: patchBody(reqUrl, init.body) });
          return originalFetch(input, nextInit);
        }

        // Some app paths call fetch(Request) rather than fetch(url, init).
        // In that case we need to clone and patch the request body ourselves.
        if (!init && input && typeof input.clone === "function" && typeof input.text === "function") {
          return input.clone().text().then(function (bodyText) {
            if (typeof bodyText !== "string" || !bodyText) return originalFetch(input);
            var patchedBody = patchBody(reqUrl, bodyText);
            if (patchedBody === bodyText) return originalFetch(input);
            var reqInit = {
              method: input.method,
              headers: new Headers(input.headers || {}),
              body: patchedBody,
              mode: input.mode,
              credentials: input.credentials,
              cache: input.cache,
              redirect: input.redirect,
              referrer: input.referrer,
              referrerPolicy: input.referrerPolicy,
              integrity: input.integrity,
              keepalive: input.keepalive,
              signal: input.signal,
            };
            return originalFetch(new Request(input.url, reqInit));
          }).catch(function () {
            return originalFetch(input, init);
          });
        }

        return originalFetch(input, init);
      };

      if (window.XMLHttpRequest && window.XMLHttpRequest.prototype) {
        var originalOpen = window.XMLHttpRequest.prototype.open;
        var originalSend = window.XMLHttpRequest.prototype.send;
        window.XMLHttpRequest.prototype.open = function (method, url) {
          this.__snapshotPatchMeta = {
            method: String(method || "GET").toUpperCase(),
            url: String(url || ""),
          };
          return originalOpen.apply(this, arguments);
        };
        window.XMLHttpRequest.prototype.send = function (body) {
          var meta = this.__snapshotPatchMeta || {};
          if (typeof body === "string" && shouldPatchRequest(meta.url || "", meta.method || "GET")) {
            return originalSend.call(this, patchBody(meta.url, body));
          }
          return originalSend.apply(this, arguments);
        };
      }

      scanAndEnhanceDateInputs();
      setInterval(scanAndEnhanceDateInputs, 800);

      var observer = new MutationObserver(function () {
        scanAndEnhanceDateInputs();
      });
